name: CI

# Repository checks only. This workflow never deploys and never touches any
# remote Supabase project, Railway, production data, or any persistent
# external database. It DOES create and write disposable databases that live
# and die inside the runner — a local PostgreSQL database and a Docker-local
# Supabase stack — solely to execute the repository's own database tests.
# It runs deterministic clean installs, typecheck, lint, build, tests, and
# dependency audits across all three dependency roots (root, client, server),
# plus the shadow-database security suite.

on:
  push:
    branches-ignore:
      - Beginner
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Deterministic clean install for every dependency root ---
      - name: Clean install (root)
        run: npm ci
      - name: Clean install (client)
        run: npm ci --prefix client
      - name: Clean install (server)
        run: npm ci --prefix server

      # --- Static checks ---
      - name: Lint (client)
        run: npm run lint --prefix client
      - name: Typecheck (server)
        run: npm run typecheck --prefix server
      - name: Typecheck (client)
        run: npm run typecheck --prefix client

      # --- Build both roots (server build is a strict typecheck; it runs via tsx) ---
      - name: Build (client)
        run: npm run build --prefix client
      - name: Build (server)
        run: npm run build --prefix server

      # --- Tests ---
      - name: Test (server)
        run: npm run test --prefix server
      - name: Test (client)
        run: npm run test --prefix client
      - name: Test (shadow-db connection guard)
        run: node --test scripts/db/guard.test.mjs

      # --- Production dependency audits (BLOCKING on high/critical) ---
      # A high or critical PRODUCTION advisory fails the job. Dev-only advisories
      # do not fail these steps because --omit=dev excludes them.
      - name: Audit production deps (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production deps (client)
        run: npm audit --prefix client --omit=dev --audit-level=high
      - name: Audit production deps (server)
        run: npm audit --prefix server --omit=dev --audit-level=high

  # --- Shadow DB security suite on a REAL local Supabase stack ---
  # Runs the pinned Supabase CLI against a Docker-local stack only: no link,
  # no project ref, no remote URL, no credentials, no production data. The
  # stack is started from empty, all five migrations are applied by
  # `supabase db reset --local`, the full pgTAP suite runs against that same
  # database via `supabase test db --local`, and the stack is stopped.
  shadow-db-supabase-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read pinned Supabase CLI version
        id: cli
        run: echo "version=$(cat supabase/cli-version)" >> "$GITHUB_OUTPUT"
      - name: Start local Supabase stack (pinned CLI, local only)
        run: npx --yes supabase@${{ steps.cli.outputs.version }} start -x studio,imgproxy
      - name: Reset shadow DB from empty via pinned CLI
        run: SHADOW_DB_RUNNER=supabase-cli npm run db:reset
      - name: Run pgTAP suite inside the local stack
        run: SHADOW_DB_RUNNER=supabase-cli npm run db:test
      - name: Stop local stack
        if: always()
        run: npx --yes supabase@${{ steps.cli.outputs.version }} stop

  # --- Shadow DB security suite on plain PostgreSQL + shim (fast supplement) ---
  # NOT Supabase parity: this uses scripts/db/shim to emulate the auth/storage
  # surface on the runner's plain PostgreSQL. The supabase-stack job above is
  # the authoritative database check.
  shadow-db-postgres-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pgTAP and contrib for the runner's PostgreSQL
        run: |
          PGVER=$(psql --version | grep -oE '[0-9]+' | head -1)
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PGVER}-pgtap" postgresql-contrib
      - name: Start PostgreSQL and create a superuser for the runner
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
      - name: Reset shadow DB from empty (shim runner)
        run: npm run db:reset
      - name: Run pgTAP suite (shim runner)
        run: npm run db:test

  # --- Full audits (dev + prod), reported but NON-BLOCKING ---
  # Development advisories are surfaced here and must be read separately; they do
  # not override the production high/critical block enforced in build-and-verify.
  dev-advisory-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: Full audit (root)
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Full audit (client)
        continue-on-error: true
        run: npm audit --prefix client --audit-level=low
      - name: Full audit (server)
        continue-on-error: true
        run: npm audit --prefix server --audit-level=low
