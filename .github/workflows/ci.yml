name: CI

# Repository checks only. This workflow never deploys and never touches any
# remote Supabase project, Railway, production data, or any persistent
# external database. It DOES create and write disposable databases that live
# and die inside the runner — a local PostgreSQL database and a Docker-local
# Supabase stack — solely to execute the repository's own database tests.
# It runs deterministic clean installs, typecheck, lint, build, tests, and
# dependency audits across all three dependency roots (root, client, server),
# plus the shadow-database security suite.

on:
  push:
    branches-ignore:
      - Beginner
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Deterministic clean install for every dependency root ---
      - name: Clean install (root)
        run: npm ci
      - name: Clean install (client)
        run: npm ci --prefix client
      - name: Clean install (server)
        run: npm ci --prefix server

      # --- Static checks ---
      - name: Lint (client)
        run: npm run lint --prefix client
      - name: Typecheck (server)
        run: npm run typecheck --prefix server
      - name: Typecheck (client)
        run: npm run typecheck --prefix client

      # --- Build both roots (server build is a strict typecheck; it runs via tsx) ---
      - name: Build (client)
        run: npm run build --prefix client
      - name: Build (server)
        run: npm run build --prefix server

      # --- Tests ---
      - name: Test (server)
        run: npm run test --prefix server
      - name: Test (client)
        run: npm run test --prefix client
      - name: Test (shadow-db connection guard)
        run: node --test scripts/db/guard.test.mjs
      # Work Order 4: the database contract's enforcement pass. The escape
      # guard rejects new casts around the generated types; the negative proofs
      # assert TypeScript still REJECTS an unknown RPC, a missing or wrongly
      # typed argument, an invalid enum value, an unknown table, and an
      # incompatible result assignment.
      - name: Type-escape guard (database contract)
        run: npm run guard:escapes
      - name: 'Test (database contract: escape guard and compile-negative proofs)'
        timeout-minutes: 10
        run: node --test scripts/ci/escape-guard.test.mjs scripts/ci/type-negative.test.mjs
      - name: 'Test (shadow-db runner: budgets, supervisor, progress, manifest)'
        # These are the Work Order 11 self-tests. They spawn real processes to
        # prove a stalled child and its grandchildren are actually killed, and
        # they assert the timeout hierarchy in scripts/db/budgets.mjs still
        # matches the timeout-minutes declared in this file.
        run: node --test scripts/db/budgets.test.mjs scripts/db/supervisor.test.mjs scripts/db/progress.test.mjs scripts/db/suiteManifest.test.mjs
      - name: Test (client audit-gate policy)
        run: node --test scripts/ci/client-audit-gate.test.mjs
      - name: Test (current-state guard policy)
        run: node --test scripts/ci/current-state-guard.test.mjs
      # Fails when the governed migration set moves without updating the
      # machine-readable attestation and its derived documentation, when
      # canonical documents disagree about the production Supabase project, or
      # when a CI claim hides a rerun. The deployed runtime — never this file —
      # remains the authority for production identity.
      - name: Current-state freshness and production-identity guard
        run: node scripts/ci/current-state-guard.mjs

      # --- S1.6.7 browser quality gate (LOAD-BEARING) ---
      # Deliberately inside build-and-verify rather than in a fifth job. The
      # repository's four required checks are the merge contract; a separate
      # optional workflow would be a browser gate anyone could ignore, which is
      # the opposite of what S1.6.7 exists to establish.
      #
      # Chromium exercises all five reference viewports; WebKit smokes the two
      # iPad geometries. The suite serves the REAL production bundle from
      # 127.0.0.1 only, and every request leaving the page is answered or
      # aborted by the harness, so this step reaches no external host and no
      # database.
      - name: Install browsers for the browser gate
        run: npx --prefix client playwright install --with-deps chromium webkit
      - name: Browser quality gate (Chromium matrix, WebKit iPad smoke, axe, screenshots)
        # Failure here fails the required job: a browser regression, a screenshot
        # regression, or a serious/critical axe violation all block the merge.
        # `--update-snapshots` is never used in CI — the committed baselines are
        # the gate, and CI compares against them rather than rewriting them.
        run: npm run browser:test --prefix client
      - name: Upload browser gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-report
          path: |
            client/browser/.report
            client/browser/.results
          retention-days: 7

      # --- Production dependency audits (BLOCKING on high/critical) ---
      # A high or critical PRODUCTION advisory fails the job. Dev-only advisories
      # do not fail these steps because --omit=dev excludes them.
      - name: Audit production deps (root)
        run: npm audit --omit=dev --audit-level=high
      # The client audit runs through a NARROW conditional gate that parses the
      # audit JSON and allows EXACTLY GHSA-qwww-vcr4-c8h2 (React Router RSC-mode
      # CSRF) and only while the client stays a declarative BrowserRouter SPA with
      # no RSC surface. Any other high/critical advisory, a changed advisory
      # identity, RSC usage, a removed BrowserRouter guard, or an unparseable
      # audit fails the job. See scripts/ci/client-audit-gate.mjs.
      - name: Audit production deps (client — conditional gate)
        run: node scripts/ci/client-audit-gate.mjs
      - name: Audit production deps (server)
        run: npm audit --prefix server --omit=dev --audit-level=high

  # --- Shadow DB security suite on a REAL local Supabase stack ---
  # Runs the pinned Supabase CLI against a Docker-local stack only: no link,
  # no project ref, no remote URL, no credentials, no production data. The
  # stack is started from empty, every migration in supabase/migrations is
  # applied by `supabase db reset --local`, the full pgTAP suite runs against
  # that same database via `supabase test db --local`, and the stack is
  # stopped. The suite's file and assertion inventory is checked against
  # scripts/db/suite-manifest.json on every run.
  shadow-db-supabase-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read pinned Supabase CLI version
        id: cli
        run: echo "version=$(cat supabase/cli-version)" >> "$GITHUB_OUTPUT"
      - name: Start local Supabase stack (pinned CLI, local only)
        run: npx --yes supabase@${{ steps.cli.outputs.version }} start -x studio,imgproxy
      - name: Reset shadow DB from empty via pinned CLI
        run: SHADOW_DB_RUNNER=supabase-cli npm run db:reset
      # The database-to-TypeScript contract guard. Regenerates types from the
      # schema this job just replayed from empty and fails on any difference,
      # so a migration that lands without regenerated types cannot merge.
      #
      # Runs BEFORE the pgTAP suite deliberately: it depends only on the reset,
      # and a flaky suite should not be able to withhold a type-contract answer.
      # TEMPORARY — remove before this PR is reviewed.
      #
      # The agent environment cannot pull the Supabase container images (the
      # egress policy answers 403 at the registry blob layer), so the generated
      # contract cannot be regenerated locally. This step regenerates it here,
      # from the schema this job just replayed from empty, and uploads it so the
      # exact bytes can be committed. The check step below then verifies those
      # same bytes in the same run. This mirrors what Work Order 4 did for the
      # same reason.
      - name: TEMP regenerate the generated database types
        timeout-minutes: 8
        env:
          DB_TEST_STEP_BUDGET_MS: '480000'
          DB_TEST_JOB_BUDGET_MS: '1500000'
        run: npm run db:types:write
      - name: TEMP upload the regenerated database types
        uses: actions/upload-artifact@v4
        with:
          name: generated-database-types
          path: shared/database.types.ts
          retention-days: 1

      - name: Verify the generated database types match the replayed schema
        timeout-minutes: 8
        env:
          DB_TEST_STEP_BUDGET_MS: '480000'
          DB_TEST_JOB_BUDGET_MS: '1500000'
        run: |
          set -Eeuo pipefail
          npm run db:types:check
      - name: Run pgTAP suite inside the local stack
        # The step bound is the OUTER limit; the runner holds a strictly smaller
        # one and must be the thing that fires first. Before 2026-08-23 the
        # runner's own bound was 15 minutes under this 12-minute step, so the
        # step was always killed by GitHub with no attribution, no exit status
        # and eight orphaned processes. The two budgets below are passed in so
        # scripts/db/budgets.mjs can verify the hierarchy before running a
        # single test, and scripts/db/budgets.test.mjs asserts they still match
        # the timeout-minutes on this step and this job.
        timeout-minutes: 12
        env:
          DB_TEST_STEP_BUDGET_MS: '720000'
          DB_TEST_JOB_BUDGET_MS: '1500000'
        run: |
          set -Eeuo pipefail
          SHADOW_DB_RUNNER=supabase-cli npm run db:test
      # The transport lane. pgTAP proves the governed functions' SEMANTICS by
      # calling them positionally from SQL; this proves their DISPATCHABILITY by
      # calling them the way the server does — real HTTP, to the real PostgREST
      # in this stack, with a named JSON body. ESC-002 was a defect that only
      # this lane can see: three receiving functions kept perfect SQL semantics
      # while being unreachable by name.
      - name: Run the PostgREST transport suite (real HTTP against this stack)
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          eval "$(npx --yes supabase@${{ steps.cli.outputs.version }} status -o env)"
          RV_TRANSPORT_API_URL="$API_URL" \
          RV_TRANSPORT_ANON_KEY="$ANON_KEY" \
          RV_TRANSPORT_JWT_SECRET="$JWT_SECRET" \
          RV_TRANSPORT_DB_URL="$DB_URL" \
          npm run db:transport

      - name: Diagnostics if the stack lane failed
        # Backstop for the one case the runner cannot report on: being killed
        # from outside before it reacted. Never fails the job on its own.
        if: failure()
        timeout-minutes: 4
        continue-on-error: true
        run: SHADOW_DB_RUNNER=supabase-cli node scripts/db/diagnose.mjs ci-post-failure
      - name: Stop local stack
        if: always()
        timeout-minutes: 5
        run: |
          npx --yes supabase@${{ steps.cli.outputs.version }} stop || true
          # `supabase stop` is the clean path. If it could not complete, remove
          # whatever it left behind by label so the runner is not handed to the
          # next job with containers still holding ports and disk.
          leftover=$(docker ps -aq --filter label=com.supabase.cli.project || true)
          # The pg_prove container the CLI runs the suite in carries NO
          # com.supabase.cli.project label, so neither `supabase stop` nor a
          # label-filtered removal reaches it. Run 32655303716 ended with it
          # still up after everything else had been torn down. Match it by
          # image as well.
          orphaned_prove=$(docker ps -aq --filter ancestor=public.ecr.aws/supabase/pg_prove:3.36 || true)
          leftover="$leftover $orphaned_prove"
          if [ -n "${leftover// /}" ]; then
            echo "forcing removal of containers left behind: $leftover"
            docker rm -f $leftover || true
          fi

  # --- Shadow DB security suite on plain PostgreSQL + shim (fast supplement) ---
  # NOT Supabase parity: this uses scripts/db/shim to emulate the auth/storage
  # surface on the runner's plain PostgreSQL. The supabase-stack job above is
  # the authoritative database check.
  shadow-db-postgres-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pgTAP and contrib for the runner's PostgreSQL
        run: |
          PGVER=$(psql --version | grep -oE '[0-9]+' | head -1)
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PGVER}-pgtap" postgresql-contrib
      - name: Start PostgreSQL and create a superuser for the runner
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
      - name: Reset shadow DB from empty (shim runner)
        run: npm run db:reset
      - name: Run pgTAP suite (shim runner)
        # timeout-minutes bounds the STEP; scripts/db/test.mjs bounds each file
        # AND the suite, both strictly below this, and holds back a reserve so
        # it can capture diagnostics and sweep abandoned backends before the
        # step's own clock runs out. See scripts/db/budgets.mjs.
        timeout-minutes: 10
        env:
          DB_TEST_STEP_BUDGET_MS: '600000'
          DB_TEST_JOB_BUDGET_MS: '900000'
        run: |
          set -Eeuo pipefail
          npm run db:test
      - name: Diagnostics if the shim lane failed
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/db/diagnose.mjs ci-post-failure
      - name: Prove the runner names a failing file and cleans up after itself
        # Injects a deliberately failing assertion into a miniature suite and
        # asserts the runner reports that exact file, exits nonzero, and leaves
        # nothing running. Regression guard for the silent-timeout defect.
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          node scripts/db/runner-proof.mjs
      - name: Prove the concurrency harness fails finitely
        # Regression guard for the deadlock this suite used to hit: if the
        # harness ever regains an unbounded wait, this exits nonzero in seconds
        # instead of the job hanging until its own timeout.
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          node scripts/db/concurrency-deadline-proof.mjs

  # --- Full audits (dev + prod), reported but NON-BLOCKING ---
  # Development advisories are surfaced here and must be read separately; they do
  # not override the production high/critical block enforced in build-and-verify.
  dev-advisory-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: Full audit (root)
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Full audit (client)
        continue-on-error: true
        run: npm audit --prefix client --audit-level=low
      - name: Full audit (server)
        continue-on-error: true
        run: npm audit --prefix server --audit-level=low
